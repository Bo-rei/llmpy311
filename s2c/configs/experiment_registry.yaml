# 分析资产目录（结果、图、报告和 manifest 的唯一关系表）。
#
# ``experiments`` 登记可复现实验入口与原始 artifact；``analysis_bundles`` 登记
# 已经从这些实验生成的可阅读证据包。历史文件名不批量改名，新资产只使用
# lower_snake_case；状态和 ``supersedes`` 用来表达版本演进，不再新建 V2/V3
# 平行入口。未闭合或不同监督合同的结果不得进入主报告。
analysis_catalog_version: 1
analysis_catalog_policy:
  canonical_registry: configs/experiment_registry.yaml
  active_entrypoint: README.md
  result_root: results/analysis
  figure_root: figures
  report_root: docs/analysis
  archive_root: docs/archive/analysis
  reusable_code_root: src/protocol_v2
  frozen_legacy_code_root: src/legacy
  experiment_runner_root: scripts/experiments
  posthoc_analysis_root: tools/analysis
  maintenance_root: tools/maintenance
  new_asset_slug: lower_snake_case
  versioning: "registry revision and supersedes; no parallel V2/V3 names"
  deletion_policy: "archive first; never delete research evidence during cleanup"
  git_policy: "commit only closed evidence bundles and their reproducible source"

