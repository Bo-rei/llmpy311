# s2c 研究结果的唯一小型登记表。
#
# 大型模型、Parquet 和逐样本输出仍保留在 ../artifacts；这里仅登记如何从
# 当前 main checkout 找到入口、manifest 和论文汇总。历史目录名称不改名。
schema_version: 1
project: s2c
artifact_root: ../artifacts/s2c/outputs/experiments

experiments:
  pipeline:
    cascade_full_kir50:
      id: pipeline.cascade_full_kir50
      research_question: "Gate 改善能否在固定 Router/Expert 上传递到完整 Cascade？"
      status: complete
      entrypoints:
        - tools/train/run_cascade_components.py
        - tools/eval/prepare_cascade_gates.py
        - tools/eval/run_cascade_matrix.py
        - tools/analysis/export_cascade_repair_summary.py
      protocol: cascade_full_kir50_three_seed_four_gate
      artifact_root: cascade_full/gpu_kir50
      manifest:
        - component_plan.json
        - gates/gate_manifest.json
        - evaluations/matrix_manifest.json
        - repair_provenance.json
      summary:
        - cascade_summary.csv
        - cascade_gate_by_seed.csv
        - cascade_gate_summary.csv
        - cascade_error_decomposition.csv
        - cascade_error_decomposition_summary.csv
        - cascade_banking_tradeoff.csv
      expected_unit_count: 36
      count_source: matrix_manifest
      count_manifest: evaluations/matrix_manifest.json
      checkpoint_globs:
        - seed*/downstream/**/*.pt
        - seed*/downstream/**/*.json
        - gates/**/*.pkl
        - gates/**/*.detector.json
        - ../components/**/*.pt
        - ../minilm_representation_analysis/adaptation/**/*.pt

    cascade_repair_seed42:
      id: pipeline.cascade_repair_seed42
      research_question: "修复后的 Banking77/StackOverflow Expert 是否能稳定支持代表 Cascade？"
      status: complete
      entrypoints:
        - tools/eval/run_cascade_repair.py
        - tools/analysis/export_cascade_repair_summary.py
      protocol: representative_cascade_repair_fixed_downstream
      artifact_root: cascade_repair/gpu_kir50_seed42
      manifest:
        - repair_manifest.json
        - evaluations/matrix_manifest.json
        - repair_provenance.json
      summary:
        - cascade_summary.csv
        - cascade_error_decomposition.csv
      expected_unit_count: 12
      count_source: csv_rows
      count_summary: cascade_summary.csv
      checkpoint_globs:
        - expert_models/**/*.pt

    historical_archive_full_pipeline_lora:
      id: pipeline.historical_archive_full_pipeline_lora
      research_question: "在旧 archive 数据协议下，Trainable/LoRA MiniLM Gate 能否把收益传递到完整 Gate→Router→Expert？"
      status: complete_seed42
      entrypoints:
        - tools/legacy/analysis_v19/run_trainable_minilm_historical_v1.py
        - tools/train/train_router_v19.py
        - tools/train/train_all_experts_v19.py
        - tools/eval/run_historical_archive_full_pipeline.py
      protocol: historical_v19_archive
      artifact_root: ../../runs/historical_archive_full_pipeline_seed42
      manifest:
        - clinc150/kir50_seed42/MANIFEST.json
        - stackoverflow/kir50_seed42/MANIFEST.json
        - banking77/kir50_seed42/MANIFEST.json
      summary:
        - clinc150/kir50_seed42/per_method.csv
        - stackoverflow/kir50_seed42/per_method.csv
        - banking77/kir50_seed42/per_method.csv
      expected_unit_count: 9
      count_source: none
      notes: "Seed42 Frozen/Partial/LoRA Gate comparison with archive-data Router/Expert retraining; raw predictions remain outside Git."

    historical_archive_gate_workpoint_tuning:
      id: pipeline.historical_archive_gate_workpoint_tuning
      research_question: "在论文 OOS F1 为主目标时，Gate 的 K、lambda、threshold 和接受规则能否改善当前 full pipeline？"
      status: complete_seed42
      entrypoints:
        - tools/analysis/search_historical_archive_gate_workpoints.py
        - tools/analysis/materialize_historical_archive_gate_candidates.py
        - tools/eval/run_historical_archive_full_pipeline.py
      protocol: historical_v19_archive_development_tuning
      config: configs/experiments/historical_archive_tuned_full_pipeline.yaml
      artifact_root: ../../runs/historical_archive_tuned_full_pipeline_seed42
      manifest:
        - clinc150/kir50_seed42/MANIFEST.json
        - stackoverflow/kir50_seed42/MANIFEST.json
        - banking77/kir50_seed42/MANIFEST.json
      summary:
        - clinc150/kir50_seed42/per_method.csv
        - stackoverflow/kir50_seed42/per_method.csv
        - banking77/kir50_seed42/per_method.csv
      expected_unit_count: 9
      count_source: none
      notes: "Validation-OOS labels selected development workpoints; test OOS was confirmation only; standard banking77 remains separate from historical banking77_oos."

    historical_trainable_parameter_full_pipeline:
      id: pipeline.historical_trainable_parameter_full_pipeline
      research_question: "在历史论文主线 H1 协议下，训练后的 MiniLM Gate 的边界参数能否改善真实 full pipeline 的 OOS F1？"
      status: complete_h1_parameter_search
      entrypoints:
        - tools/eval/run_historical_trainable_parameter_full_pipeline.py
        - tools/analysis/build_historical_trainable_parameter_full_pipeline_summary.py
      protocol: historical_v19_paper_main__H1_controlled_gate_to_router_to_expert
      config: configs/experiments/historical_trainable_parameter_full_pipeline.yaml
      artifact_root: ../../../../s2c/results/analysis/historical_trainable_parameter_full_pipeline
      manifest:
        - MANIFEST.json
        - FIGURE_MANIFEST.json
      summary:
        - selected_validation.csv
        - full_pipeline_selected_summary.csv
        - paper_beating_candidates.csv
      expected_unit_count: 9
      count_source: csv_rows
      count_summary: full_pipeline_selected_per_seed.csv
      notes: "Uses existing H1 Trainable last2+projection checkpoints and fixed H1 Router/Expert components; test is confirmation only; no raw predictions are retained."

    historical_trainable_adaptive_centers:
      id: pipeline.historical_trainable_adaptive_centers
      research_question: "Can train-only adaptive per-intent K improve H1 validation-selected OOS F1?"
      status: complete_h1_adaptive_search
      entrypoints:
        - scripts/experiments/run_historical_trainable_adaptive_centers.py
        - tools/analysis/build_historical_trainable_adaptive_centers_report.py
      protocol: historical_v19_paper_main
      config: configs/experiments/historical_trainable_adaptive_centers.yaml
      artifact_root: ../../../../s2c/results/analysis/historical_trainable_adaptive_centers
      manifest: [MANIFEST.json]
      summary: [selected_test_per_seed.csv, selected_test_summary.csv]
      expected_unit_count: 9
      count_source: none
      notes: "Train Known only rankings; no auxiliary guard; choices locked before test; fixed controls rerun under changed objective."

    historical_trainable_checkpoint_selection:
      id: pipeline.historical_trainable_checkpoint_selection
      research_question: "Can validation-OOS checkpoint selection and longer representation training close the CLINC gap?"
      status: complete_h1_checkpoint_followup
      entrypoints: [scripts/experiments/run_historical_trainable_checkpoint_selection.py, tools/analysis/build_historical_trainable_checkpoint_selection_report.py]
      protocol: historical_v19_paper_main
      config: configs/experiments/historical_trainable_checkpoint_selection.yaml
      artifact_root: ../../../../s2c/results/analysis/historical_trainable_checkpoint_selection
      manifest: [MANIFEST.json]
      summary: [candidate_validation.csv, selected_test_per_seed.csv, selected_test_summary.csv]
      expected_unit_count: 9
      count_source: none
      notes: "Nine training recipes completed; three CUDA confirmations after global selection lock. CLINC OOS F1 91.64+/-0.27 percent, one seed exceeds 91.96 reference; macro/Accuracy loss and score-oracle diagnostics reported."

    historical_trainable_gate_search:
      id: pipeline.historical_trainable_gate_search
      research_question: "Can existing Trainable checkpoints plus adaptive centers and covariance/radius rules close the CLINC KIR=.50 gap?"
      status: complete_h1_geometry_search
      entrypoints: [scripts/experiments/run_historical_trainable_gate_search.py]
      protocol: historical_v19_paper_main__H1_controlled_gate_to_router_to_expert
      config: configs/experiments/historical_trainable_gate_search.yaml
      artifact_root: ../../../../s2c/results/analysis/historical_trainable_gate_search
      manifest: [MANIFEST.json]
      summary: [selected_test.csv, selection_lock.json]
      expected_unit_count: 3
      count_source: csv_rows
      count_summary: selected_test.csv
      notes: "Four representation families and ten geometry variants searched with validation-only selection; best full-pipeline OOS F1 91.79+/-0.43, still below 91.96."

    historical_trainable_gate_recipe_search:
      id: pipeline.historical_trainable_gate_recipe_search
      research_question: "Can Known-only loss and optimization changes improve CLINC KIR=.50 score ranking?"
      status: complete_h1_recipe_search
      entrypoints: [scripts/experiments/run_historical_trainable_gate_recipe_search.py]
      protocol: historical_v19_paper_main__H1_controlled_gate_to_router_to_expert
      config: configs/experiments/historical_trainable_gate_recipe_search.yaml
      artifact_root: ../../../../s2c/results/analysis/historical_trainable_gate_recipe_search
      manifest: [MANIFEST.json]
      summary: [candidate_validation.csv, selected_test.csv, selection_lock.json]
      expected_unit_count: 12
      count_source: none
      notes: "Four Known-only recipes x three seeds; validation-selected checkpoints and real CUDA pipeline confirmation. Best OOS F1 91.93+/-0.48, 0.03pp below paper reference."

    historical_trainable_kir25_full_pipeline:
      id: pipeline.historical_trainable_kir25_full_pipeline
      research_question: "Can the existing Trainable K=1 Gate that exceeds the KIR=.25 paper reference also exceed it after matched Router/Expert inference?"
      status: complete_h1_kir25_full_pipeline
      entrypoints:
        - tools/train/run_cascade_components.py
        - tools/eval/run_historical_trainable_full_pipeline.py
      protocol: historical_v19_paper_main__H1_controlled_gate_to_router_to_expert
      config: null
      artifact_root: cascade_full/gpu_kir25
      manifest: [component_plan.json]
      summary: [../../../../../../s2c/results/analysis/historical_trainable_kir25_full_pipeline/per_seed.csv, ../../../../../../s2c/results/analysis/historical_trainable_kir25_full_pipeline/MANIFEST.json]
      expected_unit_count: 9
      count_source: csv_rows
      count_summary: ../../../../../../s2c/results/analysis/historical_trainable_kir25_full_pipeline/per_seed.csv
      notes: "KIR=.25 Trainable K=1 matched full pipeline is now complete for all 3 datasets and 3 seeds (9 CUDA confirmations). CLINC OOS F1 95.10+/-0.30 versus fulltex reported reference 95.01; Banking77-OOS remains descriptive because its data key differs from the paper Banking77 reference."

    historical_trainable_kir75_full_pipeline:
      id: pipeline.historical_trainable_kir75_full_pipeline
      research_question: "What is the complete current H1 Trainable K=1 full-pipeline result at KIR=.75 across all datasets?"
      status: complete_h1_kir75_full_pipeline
      entrypoints:
        - tools/train/run_cascade_components.py
        - tools/eval/run_historical_trainable_full_pipeline.py
      protocol: historical_v19_paper_main__H1_controlled_gate_to_router_to_expert
      config: null
      artifact_root: cascade_full/gpu_kir75
      manifest: [component_plan.json]
      summary: [../../../../../../s2c/results/analysis/historical_trainable_kir75_full_pipeline/per_seed.csv, ../../../../../../s2c/results/analysis/historical_trainable_kir75_full_pipeline/MANIFEST.json]
      expected_unit_count: 9
      count_source: csv_rows
      count_summary: ../../../../../../s2c/results/analysis/historical_trainable_kir75_full_pipeline/per_seed.csv
      notes: "Three datasets x three seeds; all Router/Expert components and full-pipeline confirmations used CUDA; current H1 Trainable K=1 results are compared to fulltex reported references with Banking77 protocol caveat."

    historical_trainable_oos_priority_search:
      id: pipeline.historical_trainable_oos_priority_search
      research_question: "Can validation OOS-F1-only boundary selection improve Banking77-OOS while explicitly allowing Known degradation?"
      status: complete_h1_oos_priority_search
      entrypoints:
        - tools/eval/run_historical_trainable_parameter_full_pipeline.py
        - tools/analysis/build_historical_trainable_oos_priority_report.py
      protocol: historical_v19_paper_main__H1_controlled_gate_to_router_to_expert
      config: null
      artifact_root: ../../../../s2c/results/analysis/historical_trainable_oos_priority_search
      manifest:
        - MANIFEST.json
        - kir25/MANIFEST.json
        - kir50/MANIFEST.json
        - kir75/MANIFEST.json
      summary:
        - summary.csv
        - per_seed.csv
      expected_unit_count: 9
      count_source: none
      notes: "Banking77-OOS only; validation OOS F1 is the sole selection objective, Known F1/Accuracy are diagnostics. KIR=.25 reaches 95.95+/-0.48 OOS F1, +1.96pp versus historical Ours 93.99, with Known Recall cost."

    paper_setting_ablation:
      id: pipeline.paper_setting_ablation
      research_question: "在论文原始设置下，Gate、级联 backbone 和无 Gate 变体的消融结果是否完整可追溯？"
      status: complete_historical_anchor
      entrypoints:
        - tools/analysis/build_historical_paper_ablation_report.py
      protocol: historical_v19_paper_main_paper_ablation_anchor
      artifact_root: ../../outputs/paper_results
      manifest: [ablation_ledger.json]
      summary: [ablation_summary.csv]
      expected_unit_count: 36
      count_source: csv_rows
      count_summary: ablation_summary.csv
      notes: "完整覆盖 3 数据集×3 KIR×4 论文变体；这是历史 paper-anchor artifact，不是本轮 CUDA H1 消融重跑。"

  gate_mechanism:
    cluster_separability_v19:
      id: gate_mechanism.cluster_separability_v19
      research_question: "KIR、每意图子中心数和距离族如何改变 Known/OOS 可分性？"
