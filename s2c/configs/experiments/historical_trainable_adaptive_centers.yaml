schema_version: 1
experiment: historical_trainable_adaptive_centers
protocol: historical_v19_paper_main
evidence_level: H1 controlled
datasets: [clinc150, stackoverflow, banking77_oos]
kir: 0.50
seeds: [13, 42, 87]
representation: existing_trainable_last2_minilm_plus_projection
